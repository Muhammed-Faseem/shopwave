apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shopwave-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: shopwave-api
      interval: 30s
      rules:

        # Alert 1: API error rate exceeds 5%
        - alert: ShopWaveHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{
                namespace="shopwave",
                status_code=~"5.."
              }[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  namespace="shopwave"
                }[5m])),
                0.000000001
              )
            ) > 0.05
            and
            sum(rate(http_requests_total{
              namespace="shopwave"
            }[5m])) > 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "ShopWave API error rate above 5%"
            description: "API error rate exceeded 5% over the last 5 minutes."

        # Alert 2: API P99 latency exceeds 1 second
        - alert: ShopWaveHighLatency
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  namespace="shopwave"
                }[5m])
              )
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ShopWave API P99 latency above 1 second"
            description: "P99 response latency is above 1 second."

        # Alert 3: Pod restarts more than 3 times in 15 minutes
        - alert: ShopWavePodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="shopwave"
            }[15m]) > 3
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ShopWave pod is restarting repeatedly"
            description: "Pod {{ $labels.pod }} has restarted more than 3 times."

        # Alert 4: HPA has reached maximum replicas
        - alert: ShopWaveHPAMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{
              namespace="shopwave"
            }
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{
              namespace="shopwave"
            }
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ShopWave HPA reached maximum replicas"
            description: "Consider increasing the maximum replicas or instance capacity."
