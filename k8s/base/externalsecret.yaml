apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shopwave-secrets
  namespace: shopwave
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: shopwave-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: shopwave/production/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: shopwave/production/redis
        property: url
    - secretKey: JWT_SECRET
      remoteRef:
        key: shopwave/production/app
        property: jwt_secret
    - secretKey: SQS_ORDER_QUEUE_URL
      remoteRef:
        key: shopwave/production/app
        property: sqs_url
