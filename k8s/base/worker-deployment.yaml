apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shopwave
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      tolerations:
        - key: "spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - spot
      containers:
        - name: worker
          image: 967283278916.dkr.ecr.ap-south-1.amazonaws.com/shopwave/worker:c92945d1943d1ea8f2a144dcd6ec28d85cc1e303
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          envFrom:
            - configMapRef:
                name: shopwave-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopwave-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shopwave-secrets
                  key: REDIS_URL
            - name: SQS_ORDER_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: shopwave-secrets
                  key: SQS_ORDER_QUEUE_URL
