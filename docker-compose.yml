version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shopwave
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwave"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services/api
      target: runtime
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://shopwave:localdev@postgres:5432/shopwave
      REDIS_URL: redis://redis:6379
      SQS_ORDER_QUEUE_URL: ${SQS_ORDER_QUEUE_URL:-}
      AWS_REGION: ap-south-1
      JWT_SECRET: local-dev-jwt-secret-not-for-production
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
      target: runtime
    environment:
      DATABASE_URL: postgres://shopwave:localdev@postgres:5432/shopwave
      REDIS_URL: redis://redis:6379
      SQS_ORDER_QUEUE_URL: ${SQS_ORDER_QUEUE_URL:-}
      AWS_REGION: ap-south-1
      FROM_EMAIL: noreply@shopwave.local
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
