---
- name: Install bastion packages
  ansible.builtin.package:
    name:
      - aide
      - audit
      - openssh-server
    state: present

- name: Deploy SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd

- name: Deploy login banner
  ansible.builtin.template:
    src: banner.txt.j2
    dest: /etc/issue.net
    owner: root
    group: root
    mode: '0644'
